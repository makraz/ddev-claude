name: publish-image

on:
  push:
    tags:
      - 'v*'           # any version tag, including pre-releases like v0.3.0-beta.1
  workflow_dispatch:    # manual fallback

permissions:
  contents: read
  packages: write       # GHCR push

jobs:
  build-and-push:
    name: build & push base image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture Claude Code version
        run: |
          CLAUDE_VERSION=$(docker run --rm debian:bookworm-slim bash -c '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null &&
            curl -fsSL https://claude.ai/install.sh | bash >/dev/null &&
            ~/.local/bin/claude --version
          ' | head -1 | awk '{print $1}')
          if ! printf '%s' "$CLAUDE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "could not resolve a semver from the installer: '$CLAUDE_VERSION'" >&2
            exit 1
          fi
          echo "CLAUDE_VERSION=$CLAUDE_VERSION" >> "$GITHUB_ENV"
          echo "Resolved Claude Code version: $CLAUDE_VERSION"

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          # Pin the agent version for BOTH architectures from a single resolved
          # value. Without this each arch runs the installer independently and an
          # upstream release mid-build would ship two different versions under
          # one manifest — and the label below would describe neither reliably.
          build-args: |
            CLAUDE_VERSION=${{ env.CLAUDE_VERSION }}
          # Signed build provenance + SBOM, so a user pulling this image can
          # verify it was built from this repo at this tag, and see what is in it.
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ddev-claude-base:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
            io.makraz.ddev-claude.claude-version=${{ env.CLAUDE_VERSION }}
