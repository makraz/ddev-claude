version: 2
updates:
  # GitHub Actions used by tests.yml / publish-image.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/ci
    commit-message:
      prefix: ci

  # Base image in image/Dockerfile (debian:bookworm-slim and friends)
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/image
    commit-message:
      prefix: build
