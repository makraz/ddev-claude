# ddev-generated
#
# Install manifest for ddev-claude.
# Spec: https://ddev.readthedocs.io/en/stable/users/extend/additional-services/

name: claude

ddev_version_constraint: '>= v1.24.0'

pre_install_actions:
  - |
    #ddev-description:Sandboxed Claude Code CLI with outbound firewall and YOLO mode
  - |
    echo "Installing ddev-claude..."
    echo "Architecture: $(uname -m)"
  - |
    # Bootstrap the project-local state directory.
    set -e
    mkdir -p .ddev/.claude/bash_history.d
    # Try to align ownership with the in-container uid 1000. Best-effort:
    # may fail on hosts where the user doesn't have permission to chown.
    chown -R 1000:1000 .ddev/.claude 2>/dev/null || true

    # Ensure the project-root .gitignore excludes the state dir, the escape
    # hatch, and the build-image.sh outputs. We write to ./.gitignore (project
    # root) because .ddev/.gitignore is regenerated by DDEV on every start.
    touch .gitignore
    for entry in '/.ddev/.claude/' '/.ddev/.claude.export/' '/.ddev/claude.local/' '/.ddev/claude/Dockerfile' '/.ddev/claude/extra-domains.list' '/.ddev/claude/settings.json' '/.ddev/claude/tools.list' '/.ddev/claude/.mount-mode' '/.ddev/claude/.build-stamp' '/.ddev/docker-compose.claude-mounts.yaml'; do
      grep -qxF "$entry" .gitignore || echo "$entry" >> .gitignore
    done

project_files:
  - docker-compose.claude.yaml
  - config.claude.yaml
  - claude/Dockerfile.base
  - claude/build-image.sh
  - claude/init-firewall.sh
  - claude/entrypoint.sh
  - claude/claude-shim
  - claude/extras/php.fragment
  - claude/extras/php.domains
  - claude/extras/python.fragment
  - claude/extras/python.domains
  - claude/extras/node.fragment
  - claude/extras/node.domains
  - commands/host/claude

global_files: []

post_install_actions:
  - |
    cat <<'BANNER'

    ──────────────────────────────────────────────────────────────────
     ddev-claude installed.

     BREAKING in v0.4.0 — read this if you are upgrading:

       * The agent's built-in tool set is now restricted. With no
         `tools:` key in .ddev/claude.yaml the default is:
             Read, Write, Bash, Skill
         Notably Edit, Grep, Glob and Task are OFF. Add them back with
         a `tools:` list if you want them.

       * Plugins are now curated. With no `plugins:` key the default is:
             superpowers, code-review, gitlab, code-simplifier
         Python-backed plugins (remember, security-guidance) need the
         `python` extra; Node-backed ones need `node`.

       * Claude's state moved from .ddev/.claude/ into a Docker volume.
         It is seeded from the old directory on first start; the old
         directory is left in place for you to delete once satisfied.
         `ddev claude state` copies the volume back out.

       * The project is now mounted through DDEV's Mutagen volume when
         Mutagen is enabled. `ddev claude` refuses to start while the
         sync is still staging, rather than showing the agent an empty
         tree.

     Config lives in .ddev/claude.yaml:

         extras:                 [ php | python | node ]
         extra_allowed_domains:  extra outbound hosts
         tools:                  built-in tools the agent may use
         plugins:                plugins to enable
         mount_mode:             auto | mutagen | bind

     Next steps:
       1. (optional) edit .ddev/claude.yaml
       2. export ANTHROPIC_API_KEY=sk-ant-...   (or OAuth on first run)
       3. ddev restart
       4. ddev claude

     After changing tools/plugins/extras: ddev claude rebuild && ddev restart

     To uninstall:
       ddev add-on remove claude
    ──────────────────────────────────────────────────────────────────
    BANNER

removal_actions:
  - |
    # Remove addon-managed files only. User-managed files
    # (.ddev/claude.yaml, .ddev/.claude/, .ddev/claude.local/) are kept.
    set -e
    rm -f .ddev/claude/Dockerfile
    rm -f .ddev/claude/extra-domains.list
    rm -f .ddev/claude/settings.json
    rm -f .ddev/claude/tools.list
    rm -f .ddev/claude/.mount-mode
    rm -f .ddev/claude/.build-stamp
    rm -f .ddev/docker-compose.claude-mounts.yaml
    echo "ddev-claude removed."
    echo "Preserved (user-managed; remove manually if desired):"
    echo "    .ddev/claude.yaml          (per-project config)"
    echo "    .ddev/.claude/             (pre-v0.4.0 state, if present)"
    echo "    .ddev/claude.local/        (escape-hatch fragments)"
    echo ""
    echo "Your Claude auth and session history live in a Docker volume that is"
    echo "NOT removed automatically. Delete it only if you want to re-authenticate:"
    echo "    docker volume rm ${DDEV_SITENAME}_claude_state"

yaml_read_files: {}
