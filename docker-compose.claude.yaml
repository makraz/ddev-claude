#ddev-generated
# ---------------------------------------------------------------------------
# ddev-claude — sidecar service definition.
#
# Adds a `claude` container alongside the standard ddev `web` service.
# The container's PID 1 (entrypoint.sh, run as root) activates the outbound
# firewall at start, then idles with `sleep infinity`. The actual Claude Code
# session is launched on demand, as uid 1000, by `ddev claude`.
# ---------------------------------------------------------------------------
services:
    claude:
        build:
            context: ./claude
        container_name: ddev-${DDEV_SITENAME}-claude
        # Run PID 1 as root so entrypoint.sh can configure iptables/ipset at
        # start. Interactive Claude sessions are still uid 1000 — the `ddev
        # claude` host command always execs with `--user claude`.
        user: root
        working_dir: /var/www/html
        # Volumes are supplied by the generated
        # .ddev/docker-compose.claude-mounts.yaml, because the mount topology
        # depends on whether Mutagen is enabled for this project. DDEV merges
        # every .ddev/docker-compose.*.yaml file; an override written anywhere
        # else is silently ignored.
        environment:
            - ANTHROPIC_API_KEY
            - PLAYWRIGHT_BASE_URL=https://web
            - CLAUDE_CONFIG_DIR=/home/claude/.claude
            - GITHUB_PERSONAL_ACCESS_TOKEN
            - GH_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN:-}
            - EXTRA_ALLOWED_DOMAINS
        cap_add:
            - NET_ADMIN
            - NET_RAW
        labels:
            com.ddev.site-name: ${DDEV_SITENAME}
            com.ddev.approot: $DDEV_APPROOT
        depends_on:
            - web
        networks:
            - default
        entrypoint: /usr/local/bin/entrypoint.sh
